[package]
name = "tile-rummy-wasm"
version = "0.1.0"
edition = "2021"

# The engine for the browser. Built by web/'s `npm run wasm` (wasm-pack)
# into web/src/games/tile-rummy/wasm/.

[lib]
crate-type = ["cdylib"]

[dependencies]
tile-rummy = { path = "../tile-rummy", features = ["wasm"] }
# The messages to and from the server (their TypeScript types come with it).
protocol = { path = "../../crates/protocol", features = ["wasm"] }
wasm-bindgen = "0.2.129"
serde = { version = "1", features = ["derive"] }
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
