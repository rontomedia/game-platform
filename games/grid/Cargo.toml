[package]
name = "grid"
version = "0.1.0"
edition = "2021"

# Grid placement (Tic-Tac-Toe, Gomoku): pure rules and bots, like
# games/tile-rummy. Shared by the server and the browser (through
# games/grid-wasm).

[dependencies]
serde = { version = "1", features = ["derive"] }
# The `wasm` feature makes the types cross into JS with TypeScript
# definitions (used by games/grid-wasm only).
tsify = { version = "0.5.8", optional = true, default-features = false, features = ["js"] }
# The code tsify generates names it.
wasm-bindgen = { version = "0.2.129", optional = true }

[features]
wasm = ["dep:tsify", "dep:wasm-bindgen"]

[dev-dependencies]
serde_json = "1"
