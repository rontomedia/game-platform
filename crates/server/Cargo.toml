[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
protocol = { path = "../protocol" }
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
serde_json = "1"
tokio-tungstenite = "0.30"
