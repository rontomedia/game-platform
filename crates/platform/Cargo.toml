[package]
name = "platform"
version = "0.1.0"
edition = "2021"

# What every game's rooms share: the room actor over the GameEngine
# trait, rooms by code, seats, watchers, clocks, bots. Knows no game.

[dependencies]
rand = "0.10.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.54", features = ["rt", "macros", "sync", "time"] }
